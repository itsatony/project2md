[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "project2md"
version = "1.4.0"
description = "Transform directories or git repositories into comprehensive Markdown documentation with intelligent file filtering and structure preservation."
authors = [
    {name = "itsatony",email = "i@itsatony.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=5.1.0",
    "pathspec>=0.9.0",
    "click>=7.0.0",
    "rich>=9.0.0",
    "gitpython>=3.1.0",
    "humanize>=3.0.0",
    "chardet>=3.0.4",  # Removed upper bound
    "setuptools>=42.0.0",
    "toml>=0.10.2"
]

[tool.poetry.dependencies]
click = "^8.1.7"
rich = "^13.7.1"
pyyaml = "^6.0.1"
pathspec = "^0.12.1"
gitpython = "^3.1.43"
toml = "^0.10.2"
humanize = "^3.0.0"
chardet = "^3.0.4"

[tool.poetry.group.dev.dependencies]
# These are exactly what `make ci-local` runs. pylint was declared here for
# years with no configuration and no invocation; ruff replaces it and is the
# linter the gate enforces.
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
black = ">=23.7.0"
isort = ">=5.12.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"
build = ">=1.2.0"
twine = ">=5.0.0"

[tool.poetry.scripts]
project2md = "project2md.cli:main"  # Changed from cli:main to point to new main function

[tool.pytest.ini_options]
# Single authority for pytest config. There used to be a pytest.ini beside this
# file whose section header was "[tool:pytest]" (the setup.cfg spelling, not the
# pytest.ini one), so pytest read NONE of its options -- and, because pytest.ini
# still counted as the configfile, it also shadowed this block. Neither config
# applied. Keep exactly one.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --color=yes"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pathspec.*",
]

[tool.coverage.run]
source = ["project2md"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set is version-dependent and can also
# be widened by a developer's ambient config, which would make `make lint`
# answer differently on two machines.
select = ["E", "F", "W", "B", "UP", "SIM", "PIE", "RUF"]
ignore = [
    "E501",    # line length is black's job, not the linter's
    "RUF012",  # ClassVar annotations on mutable class attrs: churn, no defect
    "RUF001",  # the console UI prints real glyphs on purpose (e.g. the info sign)
]

[tool.ruff.lint.per-file-ignores]
# Several fixtures embed source text whose trailing/blank-line whitespace is the
# very thing under test -- stripping it would silently change the assertions.
"tests/*" = ["B017", "SIM117", "W291", "W293"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The package is only partially annotated; these are the checks that pay for
# themselves on a partially typed tree. Do not silence errors to keep it green
# -- fix them, or state the reason in a targeted ignore.
warn_unused_ignores = true
no_implicit_optional = true
